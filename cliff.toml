# git-cliff: CHANGELOG.md and the release notes, from the commit log.
#
#   make changelog          # rewrite CHANGELOG.md
#   git cliff --latest      # just the newest section, which is what the
#                           # release workflow hands to goreleaser
#
# The history is conventional-commit shaped already (feat/fix/docs/...),
# so this only has to group it and drop the noise.

[changelog]
header = """
# Changelog

Every release, newest first. Generated from the commit log by
[git-cliff](https://git-cliff.org) - run `make changelog` rather than
editing this file by hand.

"""

body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""

trim = true

[git]
conventional_commits = true
# A commit that does not parse as conventional is still a change someone
# made; dropping it silently would make the changelog quietly wrong.
filter_unconventional = false
# Breaking commits are kept whatever the filters below say, and the
# template marks them: a `feat!:` rendered as an ordinary feature is how a
# release ships "seed is off by default" with nothing to warn anyone.
protect_breaking_commits = true

# The <!-- n --> prefixes only order the sections; the template strips
# them, and markdown never renders a comment. Without them the groups come
# out alphabetically, which puts "Bug fixes" above "Features".
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^deps", group = "<!-- 3 -->Dependencies" },
  # Everything below is real work that no user of a release needs to read
  # about. Kept out rather than filed under "Other", which is where a
  # changelog goes to become unreadable.
  #
  # docs and refactor are skipped for the same reason, though they are
  # conventional types a reader might expect to see: what the docs say is
  # already readable at torrnado.dev, and a refactor is by definition a
  # change with no effect anyone outside the repo can observe. Listing
  # them buries the entries that do change what the thing does.
  { message = "^docs", skip = true },
  { message = "^refactor", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  # build is the exception among these: a toolchain or base-image bump
  # changes what is inside the binary someone downloads - the Go 1.25.13
  # bump fixed four stdlib advisories reachable from this code - so it is
  # filed under Dependencies rather than hidden.
  { message = "^build", group = "<!-- 3 -->Dependencies" },
  { message = "^Merge", skip = true },
  { body = ".*security", group = "<!-- 4 -->Security" },
  { message = ".*", group = "<!-- 5 -->Other" },
]

filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
