site_name: torrnado
site_description: A terminal BitTorrent client with a vim-like TUI and a daemon that keeps running without it.
site_url: https://torrnado.dev
repo_url: https://github.com/lestex/torrnado
repo_name: lestex/torrnado
edit_uri: edit/main/docs/
# Year and holder match LICENSE, so the two cannot drift.
copyright: '© 2026 <a href="https://github.com/lestex">@lestex</a>. MIT-licensed. Built with <a href="https://github.com/anacrolix/torrent">anacrolix/torrent</a> and <a href="https://github.com/charmbracelet/bubbletea">bubbletea</a>.'

docs_dir: docs

theme:
  name: material
  # The spiral, drawn once and used everywhere: the header, the favicon,
  # and internal/branding's character-cell version for the TUI.
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    # The terminal is usually dark, so the site starts that way and can
    # be switched. Both schemes are `custom`, which tells Material to take
    # its colours from the CSS variables docs/stylesheets/torrnado.css
    # sets rather than from a named palette -- that file carries GitHub's
    # Primer tokens, which no built-in palette matches.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/torrnado.css

extra:
  # Drops "Made with Material for MkDocs" from the footer. A supported
  # switch in the theme's own copyright partial, not a CSS workaround.
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lestex/torrnado
      name: torrnado on GitHub

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quick-start.md
  - Guide:
      - The TUI: guide/tui.md
      - Command line: guide/cli.md
      - Configuration: guide/configuration.md
      - Themes: guide/themes.md
      - Streaming preview: guide/streaming.md
  - Running a server:
      - The daemon: server/daemon.md
      - systemd: server/systemd.md
      - Docker: server/docker.md
  - Reference:
      - Library limitations: reference/limitations.md
      - Non-goals and caveats: reference/caveats.md
      - Development: reference/development.md
