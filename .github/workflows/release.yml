# Cuts a release from a v* tag: binaries for linux and macOS on both
# architectures, checksums, and release notes generated from the same
# cliff.toml that writes CHANGELOG.md.
#
# The tag is the trigger and the source of the version - there is no
# version committed anywhere to forget to bump. See
# docs/reference/development.md for the ritual around it.
name: release

on:
  push:
    tags: ["v*"]
  # So a release whose upload failed can be retried without moving a tag.
  workflow_dispatch:

permissions:
  contents: write # creating the release and uploading to it

env:
  # Pinned, and kept in step with the Makefile's CLIFF_IMAGE: a changelog
  # that renders differently in CI than it does locally is worse than no
  # changelog.
  CLIFF_IMAGE: orhunp/git-cliff:2.13.1

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs the tags to work out a version, and git-cliff
          # needs the history to write anything at all.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version

      # The same tests the branch had to pass, run once more against the
      # exact commit being released - a tag can be pushed at any commit,
      # including one CI never saw.
      - run: make check

      # Only the newest section, which is what belongs on the release
      # page. Written by the same config as CHANGELOG.md, so the page and
      # the file cannot drift apart.
      #
      # Through the container rather than an action, because it is the
      # same command `make changelog` falls back to and the same pinned
      # version - one fewer contract to get wrong, and the notes cannot
      # come out differently here than they do locally.
      # Written into the work tree because that is what the container has
      # mounted, then moved straight out of it: GoReleaser refuses to
      # release from a dirty tree, and an untracked RELEASE_NOTES.md counts
      # as dirty. --user is what makes the file belong to the runner
      # rather than to root, so it can be moved at all. (The Makefile
      # takes the output on stdout instead: --user fails on Docker
      # Desktop, where the container starts unprivileged and cannot drop
      # privileges further. Both produce the same bytes.)
      - name: Release notes
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD":/app -w /app ${{ env.CLIFF_IMAGE }} \
            --config cliff.toml --latest --strip header --output RELEASE_NOTES.md
          mv RELEASE_NOTES.md "$RUNNER_TEMP/RELEASE_NOTES.md"
          cat "$RUNNER_TEMP/RELEASE_NOTES.md"

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The Homebrew formula, for lestex/homebrew-tap.
  #
  # Not GoReleaser's to write. Its `brews` is deprecated - `goreleaser
  # check` fails on it - and the cask it offers instead needed a second job
  # to bring its output up to `brew style` and a post-install hook to clear
  # a quarantine flag that Homebrew only sets on casks. So the formula is
  # rendered here from the checksums this release published
  # (contrib/homebrew/render.sh), and formula.yml installs it for real on
  # Linux and macOS before anything reaches the tap.
  #
  # A -rc or -beta tag is a pre-release, and a pre-release must never become
  # what `brew install` hands people: the same rule as `release.prerelease`
  # in .goreleaser.yaml.
  formula:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/formula.yml
    with:
      tag: ${{ github.ref_name }}

  # The only thing that writes to the tap, and only once `formula` passed.
  #
  # The tap is another repository, which the automatic GITHUB_TOKEN cannot
  # write to - it is scoped to this one alone. A PAT with contents:write on
  # the tap is the only way across that boundary. Without it this job fails
  # and every other part of the release still stands; add the secret and
  # re-run the workflow from the same tag rather than moving the tag.
  #
  # Nothing to commit - a re-run - is a success.
  tap:
    needs: formula
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: formula

      - name: Write the formula to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || { echo "::error::HOMEBREW_TAP_TOKEN is not set; see docs/reference/development.md"; exit 1; }
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/lestex/homebrew-tap.git" tap
          cd tap
          mkdir -p Formula
          cp ../torrnado.rb Formula/torrnado.rb
          # The cask this replaces. A cask and a formula both named
          # torrnado make `brew install lestex/tap/torrnado` ambiguous, so
          # it leaves in the same commit the formula arrives in. Only this
          # one file: the tap holds other casks this repository does not
          # own.
          git rm -q --ignore-unmatch Casks/torrnado.rb
          git add Formula/torrnado.rb
          if git diff --cached --quiet; then
            echo "the tap already has this formula"
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "torrnado ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  # The container image, to ghcr.io/lestex/torrnado.
  #
  # Gated on the release job rather than run beside it: the image and the
  # archives are one release, and `make check` there is what says this
  # commit is fit to publish at all.
  image:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # pushing to GHCR
    steps:
      - uses: actions/checkout@v7

      # linux/arm64 is cross-compiled by the Dockerfile, so QEMU is only
      # here for the alpine runtime stage's own arm64 layers.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Also writes the OCI labels, and org.opencontainers.image.source is
      # the one that makes GHCR show the package on the repo page rather
      # than as an orphan.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # `latest` comes from the default latest=auto flavor, which
          # skips prereleases - v1.0.0-rc1 must not become latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # The archives stamp the version without its v and the commit's own
      # date; the image says the same or the two disagree about what they
      # are.
      - id: stamp
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.stamp.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.stamp.outputs.date }}
