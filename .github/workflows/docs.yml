# Builds the docs site on every docs change, publishes it to GitHub Pages
# from a v* tag only. Pages and the custom domain are set in Settings ->
# Pages; DNS lives at the registrar.
name: docs

on:
  push:
    # Both refs: a push trigger naming only branches ignores tags entirely.
    branches: [main]
    tags: ["v*"]
    # Skips code-only pushes. Not evaluated for tags, so a release always
    # publishes.
    paths:
      - docs/**
      - mkdocs.yml
      - docs-requirements.txt
      - .github/workflows/docs.yml
  # ci.yml skips docs-only changes, so without this a broken --strict
  # build would first be seen on main, by the job that publishes.
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - docs-requirements.txt
      - .github/workflows/docs.yml
  # Redeploy a release's docs without moving the tag: run it on the tag ref.
  workflow_dispatch:

# Only deploy needs Pages write, and it asks for that itself. Granting it
# here would hand the token to pull request builds too.
permissions:
  contents: read

# One deployment at a time, newest push wins. Keyed by ref, or a push to
# main would cancel an in-flight deployment of a tag.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - run: pip install -r docs-requirements.txt

      # --strict turns a broken internal link into a failed build rather
      # than a 404 someone finds later. NO_MKDOCS_2_WARNING drops a
      # banner about the upstream framework's next major version, which
      # says nothing about this build - see the Makefile.
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # A tag and nothing else: readers run the released binary, so main and
    # pull requests would document behavior they do not have.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
