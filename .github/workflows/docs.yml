# Builds the documentation site and publishes it to GitHub Pages.
#
# Pages must be enabled with "GitHub Actions" as its source (Settings ->
# Pages -> Build and deployment). Until it is, the build job passes and
# only `deploy` fails, with a bare `HttpError: Not Found`.
#
# The custom domain has to be set in those same settings. docs/CNAME is
# deployed and served, but Pages ignores it here: reading that file to
# configure a domain only applies to branch-based Pages, not to
# build_type: workflow. The DNS records live at the registrar.
name: docs

on:
  push:
    branches: [main]
    # Only when the site could actually have changed. A code-only commit
    # does not need to republish it.
    paths:
      - docs/**
      - mkdocs.yml
      - docs-requirements.txt
      - .github/workflows/docs.yml
  # So a broken build can be fixed and redeployed without an empty commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a newer push win: an in-flight build
# of older docs is not worth waiting for.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - run: pip install -r docs-requirements.txt

      # --strict turns a broken internal link into a failed build rather
      # than a 404 someone finds later. NO_MKDOCS_2_WARNING drops a
      # banner about the upstream framework's next major version, which
      # says nothing about this build -- see the Makefile.
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
