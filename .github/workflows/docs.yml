# Builds the documentation site and publishes it to GitHub Pages. Pages
# and the custom domain are enabled in Settings -> Pages; docs/CNAME is
# ignored for build_type: workflow, and DNS lives at the registrar.
name: docs

on:
  push:
    branches: [main]
    # Only when the site could actually have changed. A code-only commit
    # does not need to republish it.
    paths:
      - docs/**
      - mkdocs.yml
      - docs-requirements.txt
      - .github/workflows/docs.yml
  # ci.yml skips docs-only changes, so without this a broken --strict
  # build would first be seen on main, by the job that publishes.
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - docs-requirements.txt
      - .github/workflows/docs.yml
  # So a broken build can be fixed and redeployed without an empty commit.
  workflow_dispatch:

# Only deploy needs Pages write, and it asks for that itself. Granting it
# here would hand the token to pull request builds too.
permissions:
  contents: read

# One deployment at a time, newest push wins. Keyed by ref, or a pull
# request build would cancel an in-flight deployment of main.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs-requirements.txt

      - run: pip install -r docs-requirements.txt

      # --strict turns a broken internal link into a failed build rather
      # than a 404 someone finds later. NO_MKDOCS_2_WARNING drops a
      # banner about the upstream framework's next major version, which
      # says nothing about this build -- see the Makefile.
      - run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "true"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # A pull request proves the site builds; publishing it would put
    # unreviewed docs on torrnado.dev.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
