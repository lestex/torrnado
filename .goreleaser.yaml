# Release builds. Driven by a v* tag through .github/workflows/release.yml,
# and exercised on every push by `goreleaser build --snapshot` in ci.yml so
# a cross-compile that stopped working is found before a tag depends on it.
#
#   goreleaser check                 # validate this file
#   goreleaser build --snapshot --clean
version: 2

project_name: torrnado

before:
  hooks:
    - go mod download
    # The man page is generated from the command tree rather than kept as
    # a file to edit, so it is written here, with the version this build
    # is stamping in, and picked up by archives below.
    - go run ./cmd/torrnado man --release {{ .Version }} -o torrnado.1

builds:
  - id: torrnado
    main: ./cmd/torrnado
    binary: torrnado
    # CGO_ENABLED=0 is a decision, not a default worth drifting on - the
    # same one the Dockerfile makes, for the same reasons. It is what
    # makes cross-compiling these four targets possible at all, and it
    # picks the pure-Go bbolt piece-completion database over the cgo
    # SQLite one.
    #
    # The two do not read each other's files: someone moving from a
    # locally `go build`-ed binary to a release binary gets one full
    # re-verify of data already on disk. Said in the release notes and in
    # the install docs, because it looks exactly like a bug.
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    # -trimpath keeps build machine paths out of panic traces; the -X
    # flags are what `torrnado version` reports.
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .FullCommit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: torrnado
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      # So a server install has the unit file to hand, which is the whole
      # reason contrib/ exists.
      - contrib/torrnado.service
      # Generated by the before hook above.
      - torrnado.1

checksum:
  name_template: checksums.txt

# The Arch package, pushed to the AUR as torrnado-bin on every tag.
#
# -bin because that is what the AUR calls a package of pre-built binaries
# rather than one that compiles from source; GoReleaser appends the suffix
# itself if it is missing. A source package would be a second build to
# keep working, and this one is the same artifact the release page serves,
# checksummed by the same run.
aurs:
  - name: torrnado-bin
    ids: [torrnado]
    homepage: https://torrnado.dev/
    description: Terminal BitTorrent client with a vim-like interface and a background daemon
    license: MIT
    maintainers:
      - Andrey Larin <lestex at gmail dot com>
    # The AUR takes a push over SSH and nothing else, so this is a real
    # private key (passphrase-less, as ssh in a runner cannot answer a
    # prompt) held as a secret. Never the key itself here.
    private_key: "{{ .Env.AUR_KEY }}"
    git_url: ssh://aur@aur.archlinux.org/torrnado-bin.git
    # A -rc or -beta tag must not become what pacman installs.
    skip_upload: auto
    provides: [torrnado]
    conflicts: [torrnado]
    optdepends:
      # config.toml's default player, and what `v` in the interface runs.
      - "mpv: previewing a file while it downloads"
    package: |-
      install -Dm755 "./torrnado" "${pkgdir}/usr/bin/torrnado"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/torrnado/LICENSE"
      install -Dm644 "./torrnado.1" "${pkgdir}/usr/share/man/man1/torrnado.1"
      install -Dm644 "./README.md" "${pkgdir}/usr/share/doc/torrnado/README.md"
      install -Dm644 "./CHANGELOG.md" "${pkgdir}/usr/share/doc/torrnado/CHANGELOG.md"

      # The unit in contrib/ is written for a hand-rolled install and says
      # /usr/local/bin; a packaged binary lives in /usr/bin. The grep is
      # not decoration - if that line ever changes shape, the sed silently
      # does nothing and the package ships a unit pointing at a path it
      # never installed. Failing the build is the cheap end of that.
      sed 's|/usr/local/bin/torrnado|/usr/bin/torrnado|' contrib/torrnado.service > torrnado.service
      grep -q '^ExecStart=/usr/bin/torrnado daemon$' torrnado.service
      install -Dm644 "./torrnado.service" "${pkgdir}/usr/lib/systemd/system/torrnado.service"

      # The unit runs as User=torrnado, which has to exist before systemd
      # can start it. sysusers.d is how a package asks for that on Arch -
      # pacman's systemd hook creates the account at install time, and
      # StateDirectory= makes /var/lib/torrnado at first start.
      #
      # printf rather than a heredoc: GoReleaser indents this whole block
      # into package(), and an indented terminator does not close a
      # heredoc - the PKGBUILD stops parsing there.
      printf 'u torrnado - "torrnado BitTorrent daemon" /var/lib/torrnado\n' > torrnado.sysusers
      install -Dm644 "./torrnado.sysusers" "${pkgdir}/usr/lib/sysusers.d/torrnado.conf"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# The release notes come from git-cliff, generated from the same cliff.toml
# that writes CHANGELOG.md, and passed in with --release-notes. Two tools
# generating two changelogs from the same commits is how they end up
# disagreeing.
#
# Which is why this must NOT say `disable: true`, however much it looks
# like it should. --release-notes is read *by* the changelog pipe, so
# disabling the pipe throws the file away as well and the release body
# silently falls back to the footer below and nothing else - which is
# exactly what v0.1.0 shipped with before it was edited by hand. Passing
# --release-notes is already what stops GoReleaser writing its own notes;
# the flag replaces the generated changelog rather than adding to it.
changelog:
  disable: false

release:
  # A -rc or -beta tag lands as a pre-release without anyone remembering
  # to tick a box.
  prerelease: auto
  footer: |
    ---

    **Which build to take**: `linux_amd64` for a typical server or the
    Docker host, `darwin_arm64` for an Apple Silicon Mac.

    These binaries are built without cgo, so they keep piece-completion
    state in a pure-Go database rather than the SQLite one a local
    `go build` uses. Swapping one for the other re-verifies data already
    on disk once - it is not lost, just checked again.
